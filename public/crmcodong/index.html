<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<title>Báo cáo tài chính — Aptis Kỳ Tích</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<style>
:root{color-scheme:light;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--soft:#f8fafc;
 --brand:#1f4e79;--brand-soft:#eef4fa;--up:#047857;--down:#b91c1c;
 --warn-bg:#fffbeb;--warn-line:#fcd34d;--warn-ink:#78350f}
*{box-sizing:border-box}
body{margin:0;padding:20px 18px 60px;background:#f1f5f9;color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:13.5px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto}
.sheet{background:#fff;border-radius:14px;padding:22px 24px 28px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
h1{font-size:21px;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:11.5px}
.hr{height:3px;background:var(--brand);border-radius:2px;margin:12px 0 14px}
#bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;
 padding:9px 12px;background:var(--brand-soft);border:1px solid #d6e3ef;border-radius:10px;margin-bottom:10px}
#bar label{font-size:11.5px;color:var(--muted);font-weight:600}
#bar button{font:inherit;font-size:12px;padding:5px 12px;border:1px solid #c9d8e6;background:#fff;
 color:var(--brand);border-radius:7px;cursor:pointer}
#bar button.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
#bar input[type=date]{font:inherit;font-size:12px;padding:4px 7px;border:1px solid #c9d8e6;border-radius:7px;background:#fff}
#bar .sep{width:1px;height:20px;background:#c9d8e6;margin:0 5px}
#tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
#tabs button{font:inherit;font-size:13px;font-weight:600;padding:8px 15px;border:none;background:none;
 color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-2px}
#tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.insight{background:var(--brand-soft);border:1px solid #d6e3ef;border-radius:9px;padding:9px 13px;
 font-size:12.5px;margin-bottom:14px;line-height:1.5}
.insight b{color:var(--brand)}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.sec-h h2{font-size:12px;margin:0;color:var(--brand);text-transform:uppercase;letter-spacing:.7px;font-weight:800}
.sec-h .tag{font-size:11px;color:var(--muted)}
.row{display:grid;gap:10px}
.c2{grid-template-columns:repeat(2,1fr)}.c4{grid-template-columns:repeat(4,1fr)}.c5{grid-template-columns:repeat(5,1fr)}
.card{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--soft)}
.card .lab{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.card .val{font-size:18px;font-weight:750;margin-top:4px;letter-spacing:-.4px}
.card .note{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.hero .card{background:linear-gradient(180deg,#f7fbff,#fff);border-color:#cddcea;padding:14px 16px}
.hero .val{font-size:23px}
.pos{color:var(--up)}.neg{color:var(--down)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--brand);color:#fff;text-align:left;padding:7px 10px;font-size:11px;font-weight:600;
 text-transform:uppercase;letter-spacing:.3px}
th:first-child{border-radius:8px 0 0 0}th:last-child{border-radius:0 8px 0 0}
td{padding:6px 10px;border-bottom:1px solid #f1f5f9}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:750;border-top:2px solid var(--brand);background:var(--brand-soft)}
.bar-cell{position:relative}.bar-cell .bg{position:absolute;left:0;top:2px;bottom:2px;background:#e8f0f7;border-radius:4px}
.bar-cell span{position:relative}
.chart{height:250px;position:relative;border:1px solid var(--line);border-radius:11px;padding:10px 8px 4px}
.split{display:grid;gap:18px}.s11{grid-template-columns:1fr 1fr}.s64{grid-template-columns:1.5fr 1fr}
.fn{display:flex;flex-direction:column;gap:7px}
.fn-row{display:grid;grid-template-columns:104px 1fr 128px;align-items:center;gap:10px}
.fn-lab{font-size:11.5px;color:var(--muted);font-weight:600;text-align:right}
.fn-track{background:var(--soft);border:1px solid var(--line);border-radius:7px;height:30px;overflow:hidden}
.fn-fill{height:100%;background:linear-gradient(90deg,#1f4e79,#2f6ea5);display:flex;align-items:center;
 padding-left:11px;color:#fff;font-size:12px;font-weight:700;min-width:52px}
.fn-side{font-size:11.5px;color:var(--muted)}.fn-side b{color:var(--ink)}
.note-box{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:9px;padding:10px 12px;
 font-size:11.5px;color:var(--warn-ink);line-height:1.55;margin-top:10px}
.foot{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);color:#94a3b8;font-size:10.5px}
.center{min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center}
.box{background:#fff;border-radius:14px;padding:34px 30px;max-width:460px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.box h2{margin:0 0 8px;font-size:17px;color:var(--brand)}
.box p{margin:0;color:var(--muted);font-size:13px}
.spin{width:26px;height:26px;border:3px solid #dbe6f0;border-top-color:var(--brand);border-radius:50%;
 animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.muted{color:#94a3b8;font-style:italic}
.nl{display:flex;flex-direction:column;gap:7px}
.nl-i{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:12.5px;line-height:1.55;
 padding:9px 12px;border:1px solid var(--line);border-left-width:3px;border-radius:8px;background:#fff}
.nl-i .nl-ic{font-weight:800;text-align:center;font-size:12px;line-height:1.5}
.nl-i.x{border-left-color:var(--up)}.nl-i.x .nl-ic{color:var(--up)}
.nl-i.y{border-left-color:#d97706;background:var(--warn-bg)}.nl-i.y .nl-ic{color:#b45309}
.nl-i.d{border-left-color:var(--down);background:#fef2f2}.nl-i.d .nl-ic{color:var(--down)}
.nl-i.i{border-left-color:#94a3b8}.nl-i.i .nl-ic{color:#94a3b8}
.cat-row{cursor:pointer}
.cat-row:hover{background:#eef4fa}
.cat-row .ca{display:inline-block;width:13px;color:var(--brand);font-size:9px;vertical-align:1px}
.cat-det{display:none}
.cat-det>td{background:#f8fafc;padding:6px 10px 8px 26px;border-bottom:1px solid #e2e8f0}
.det-r{display:grid;grid-template-columns:62px 1fr 122px;gap:8px;font-size:11.5px;padding:3px 0;border-bottom:1px dashed #e2e8f0}
.det-r:last-child{border-bottom:none}
.det-r .rt{text-align:right;font-variant-numeric:tabular-nums}
.det-r em{color:var(--down);font-style:normal;font-size:10px;margin-left:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.chip{font:inherit;font-size:12px;padding:5px 12px;border:1px solid #c9d8e6;background:#fff;color:var(--brand);border-radius:999px;cursor:pointer}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:650}
.cal-wrap{overflow-x:auto;padding-bottom:4px}
.cal{width:100%;min-width:760px;border-collapse:separate;border-spacing:2px;font-size:10px}
.cal th{background:none;color:var(--muted);padding:1px 0 3px;text-align:center;font-size:9.5px;
 letter-spacing:0;text-transform:none;border-radius:0;font-weight:600;line-height:1.25}
.cal th.nm{text-align:left;padding-left:2px;width:168px;min-width:168px}
.cal td{padding:0;border:none}
.cal td.nm{font-size:11.5px;font-weight:650;padding:0 8px 0 2px;white-space:nowrap;line-height:1.3}
.cal td.nm small{display:block;font-weight:400;color:var(--muted);font-size:10px}
.cl{height:26px;border-radius:4px;background:#f1f5f9;border:1px solid #e9eef4;display:flex;
 align-items:center;justify-content:center;color:#cbd5e1;font-size:9px;font-weight:700}
.cl.we{background:#fafbfc;border-color:#f3f6f9}
.cl.f{background:var(--brand);border-color:var(--brand);color:#fff}
.cl.h{background:#9db9d1;border-color:#8fadc8;color:#fff}
.cl.p{background:repeating-linear-gradient(135deg,#dce8f3,#dce8f3 3px,#eef4fa 3px,#eef4fa 6px);
 border-color:#c9d8e6;color:#5b7ea3}
.cl.oc{box-shadow:inset 0 0 0 2px #d97706}
.leg{display:flex;gap:15px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:9px;align-items:center}
.leg i{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.nx .nx-cards{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}
.nx .nx-layout{display:grid;grid-template-columns:390px 1fr;gap:20px;margin-top:16px;align-items:start}
.nx .nx-layout.ro{grid-template-columns:1fr}
.nx .nx-form{border:1px solid #cddcea;border-radius:12px;padding:16px;background:linear-gradient(180deg,#f7fbff,#fff);position:sticky;top:14px}
.nx h3{font-size:12px;margin:0 0 12px;color:var(--brand);text-transform:uppercase;letter-spacing:.7px;font-weight:800}
.nx .nx-edit{display:none;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);
 border-radius:8px;padding:7px 10px;font-size:12px;margin-bottom:10px;align-items:center;justify-content:space-between;gap:8px}
.nx .nx-edit.on{display:flex}
.nx .f{margin-bottom:11px}
.nx .f>label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.nx .f input[type=text],.nx .f input[type=date],.nx .f select{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid #c9d8e6;
 border-radius:8px;background:#fff;color:var(--ink);outline:none}
.nx .f input:focus,.nx .f select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,78,121,.12)}
.nx .f input.bad{border-color:var(--down);box-shadow:0 0 0 3px rgba(185,28,28,.1)}
.nx .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nx .seg{display:flex;border:1px solid #c9d8e6;border-radius:8px;overflow:hidden;background:#fff}
.nx .seg button{flex:1;font:inherit;font-size:13px;padding:8px 6px;border:none;background:none;color:var(--brand);cursor:pointer;font-weight:600}
.nx .seg button+button{border-left:1px solid #c9d8e6}
.nx .seg button.on{background:var(--brand);color:#fff}
.nx .seg.st button.on[data-v="false"]{background:#b45309}
.nx .hint{font-size:11.5px;color:var(--muted);margin-top:4px;min-height:17px}
.nx .hint b{color:var(--ink)}
.nx .hint .warn{color:#b45309;font-weight:650}
.nx .hint a{color:var(--brand);cursor:pointer;font-weight:600;text-decoration:underline}
.nx .nx-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}
.nx .nx-chip{font:inherit;font-size:11.5px;padding:3px 9px;border:1px solid #c9d8e6;background:#fff;color:var(--brand);border-radius:999px;cursor:pointer}
.nx .nx-chip:hover{background:var(--brand-soft)}
.nx .nx-chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.nx .nx-btns{display:flex;gap:8px;margin-top:14px}
.nx .nx-btn{font:inherit;font-size:14px;font-weight:700;padding:10px 14px;border-radius:9px;border:1px solid var(--brand);
 background:var(--brand);color:#fff;cursor:pointer;flex:1}
.nx .nx-btn:disabled{opacity:.55;cursor:default}
.nx .nx-btn.ghost{background:#fff;color:var(--brand);flex:0 0 auto}
.nx .kbd{font-size:10.5px;color:var(--muted);text-align:center;margin-top:7px}
.nx .tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.nx .tools input[type=text]{font:inherit;font-size:12.5px;padding:6px 10px;border:1px solid #c9d8e6;border-radius:8px;min-width:200px;flex:1}
.nx .tools label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
.nx td{vertical-align:top}
.nx tr.day td{background:var(--soft);font-weight:700;font-size:11.5px;color:var(--brand);padding:5px 9px}
.nx tr.day td .dt{float:right;font-weight:650;color:var(--muted);font-variant-numeric:tabular-nums}
.nx tr.it:hover td{background:#fafcff}
.nx tr.it.editing td{background:var(--warn-bg)}
.nx tr.it.flash td{animation:nxfl 1.6s ease-out}
@keyframes nxfl{0%{background:#d1fae5}100%{background:transparent}}
.nx .desc{font-weight:600}
.nx .desc small{display:block;font-weight:400;color:var(--muted);font-size:11px;word-break:break-all;max-width:420px}
.nx .cat{font-size:11px;color:var(--muted)}
.nx .cat.unk{color:#b45309;font-weight:650}
.nx .cat.m{display:none}
.nx .bdg{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.nx .bdg.click{cursor:pointer}
.nx .bdg.p{background:#ecfdf5;color:var(--up);border-color:#a7f3d0}
.nx .bdg.u{background:#fffbeb;color:#b45309;border-color:#fcd34d}
.nx .act{white-space:nowrap;text-align:right}
.nx .act button{font:inherit;font-size:11.5px;padding:3px 8px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;color:var(--brand)}
.nx .act button.del{color:var(--down)}
.nx .act button+button{margin-left:4px}
.nx .empty{padding:26px;text-align:center;color:var(--muted)}
.nx details.log{margin-top:18px;border:1px solid var(--line);border-radius:10px;padding:10px 13px}
.nx details.log summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--brand)}
.nx .lg{font-size:12px;padding:5px 0;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:86px 70px 1fr;gap:8px}
.nx .lg:last-child{border-bottom:none}
.nx .lg .t{color:var(--muted);font-variant-numeric:tabular-nums}
.nx .lg .a{font-weight:700}.nx .lg .a.them{color:var(--up)}.nx .lg .a.sua{color:#b45309}.nx .lg .a.xoa{color:var(--down)}.nx .lg .a.khoi_phuc{color:var(--brand)}
#nxToast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
 background:#0f172a;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(15,23,42,.25);
 transition:all .2s;display:flex;gap:12px;align-items:center;z-index:50;max-width:92vw}
#nxToast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#nxToast.err{background:var(--down)}
#nxToast button{font:inherit;font-size:12.5px;font-weight:700;background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:7px;padding:3px 10px;cursor:pointer}
@media(max-width:900px){.nx .nx-layout{grid-template-columns:1fr}.nx .nx-form{position:static}.nx .nx-cards{grid-template-columns:1fr 1fr}
 .nx .hide-m{display:none}.nx .cat.m{display:block}}
@media(max-width:900px){.split{grid-template-columns:1fr!important}.c4,.c5{grid-template-columns:repeat(2,1fr)}
 body{padding:12px 10px 40px}.sheet{padding:16px 14px 20px}}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="center"><div class="box"><div class="spin"></div>
    <h2>Đang tải báo cáo</h2><p>Số liệu lấy trực tiếp từ hệ thống, vui lòng đợi vài giây.</p></div></div>
</div>

<script>
const SUPABASE_URL="https://bacoamhbatqpxatrrflz.supabase.co";
const ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhY29hbWhiYXRxcHhhdHJyZmx6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxMTgyODgsImV4cCI6MjA4ODY5NDI4OH0.BcFLY1mFlFxCK7E0E89iLlh4am3mEXkbYZaFJ4O_mpw";
const PLAN_LABEL={day:"1 ngày",week:"1 tuần",month:"1 tháng",quarter:"3 tháng",half_year:"6 tháng",lifetime:"Trọn đời"};
const vnd=n=>(n==null||!isFinite(n)?"–":Math.round(n).toLocaleString("vi-VN")+"đ");
const num=n=>(n==null||!isFinite(n)?"–":Math.round(n).toLocaleString("vi-VN"));
const pct=n=>(isFinite(n)?(n*100).toFixed(1)+"%":"–");
const dm=d=>d.split("-").reverse().join("/");
const mk=d=>d.slice(0,7);
const card=(l,v,nt,cls="")=>`<div class="card"><div class="lab">${l}</div><div class="val ${cls}">${v}</div><div class="note">${nt||""}</div></div>`;
let D=null,RANGE={mode:"month",from:null,to:null},TAB="overview",charts=[];
function fail(t,m){document.getElementById("root").innerHTML=
 `<div class="center"><div class="box"><h2>${t}</h2><p>${m}</p></div></div>`;}
const inRange=d=>RANGE.mode==="all"?true:(d>=RANGE.from&&d<=RANGE.to);
function rangeLabel(){
 if(RANGE.mode==="all")return "toàn thời gian";
 if(RANGE.mode==="month")return "tháng "+RANGE.from.slice(0,7);
 if(RANGE.mode==="30d")return "30 ngày gần nhất";
 return dm(RANGE.from)+" → "+dm(RANGE.to);}
function eom(s){const y=+s.slice(0,4),m=+s.slice(5,7);const last=new Date(Date.UTC(y,m,0)).getUTCDate();
 return s.slice(0,8)+String(last).padStart(2,"0");}
function addDays(s,k){const p=s.split("-").map(Number);const dt=new Date(Date.UTC(p[0],p[1]-1,p[2]));
 dt.setUTCDate(dt.getUTCDate()+k);return dt.toISOString().slice(0,10);}
function mkChart(id,cfg){const el=document.getElementById(id);if(el)charts.push(new Chart(el,cfg));}
function barSm(id,rows,todayISO,color,unitLabel){
 const show=rows.slice(-62);
 mkChart(id,{type:"bar",
  data:{labels:show.map(x=>dm(x.d).slice(0,5)),datasets:[{data:show.map(x=>+x.n),
   backgroundColor:show.map(x=>x.d===todayISO?"#94a3b8":color),borderRadius:4,maxBarThickness:44}]},
  options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
   tooltip:{callbacks:{label:c=>num(c.parsed.y)+" "+unitLabel}}},
   scales:{y:{grid:{color:"#f1f5f9"},ticks:{precision:0,font:{size:11}}},
    x:{grid:{display:false},ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:16,font:{size:11}}}}}});}

function barHour(id,rows){
 const peak=Math.max(...rows.map(x=>x.n));
 mkChart(id,{type:"bar",
  data:{labels:rows.map(x=>String(x.h).padStart(2,"0")+"h"),datasets:[{data:rows.map(x=>x.n),
   backgroundColor:rows.map(x=>(peak>0&&x.n===peak)?"#0e7490":"#2f6ea5"),borderRadius:4,maxBarThickness:34}]},
  options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
   tooltip:{callbacks:{label:c=>num(c.parsed.y)+" bill · "+vnd(rows[c.dataIndex].dt)}}},
   scales:{y:{grid:{color:"#f1f5f9"},ticks:{precision:0,font:{size:11}}},
    x:{grid:{display:false},ticks:{font:{size:10}}}}}});}

function shell(){
 const today=D.today,m0=today.slice(0,8)+"01";
 if(RANGE.mode==="month"&&!RANGE.from){RANGE.from=m0;RANGE.to=eom(today);}
 const tabs=[["overview","Tổng quan"],["kpi","KPI tháng"],["revenue","Doanh thu"],["customers","Khách hàng"],["costs","Thu & Chi"],["review","Đánh giá"],["year","Báo cáo năm"],["hr","Nhân sự"],["nhap","Nhập chi phí"]];
 return `<div class="sheet">
  <h1>Báo cáo tài chính — Aptis Kỳ Tích</h1>
  <div class="sub">Số liệu trực tiếp từ hệ thống, cập nhật lúc mở trang · Đơn vị VND · Mọi mốc ngày theo giờ Việt Nam
   · Người xem: <b>${D.viewer||"–"}</b> · ${D.as_of||""}</div>
  <div class="hr"></div>
  <div id="bar">
   <label>Kỳ báo cáo</label>
   <button data-m="month">Tháng này</button>
   <button data-m="30d">30 ngày</button>
   <button data-m="all">Toàn thời gian</button>
   <span class="sep"></span>

function calc(){
 const S=D.settings||{},T=D.totals||{},subs=D.subs||{},fn=D.funnel||{};
 const daily=D.daily||[],planM=D.plan_monthly||[],expItems=D.exp_items||[];
 const today=D.today,curM=today.slice(0,7);
 const dayN=+today.slice(8,10);
 const daysM=new Date(+today.slice(0,4),+today.slice(5,7),0).getDate();
 const prevM=(()=>{const y=+today.slice(0,4),m=+today.slice(5,7);
   return m===1?(y-1)+"-12":y+"-"+String(m-1).padStart(2,"0");})();
 const rev=+T.rev||0,ord=+T.orders||0,expPaid=+T.exp_paid||0,expUnpaid=+T.exp_unpaid||0;
 const fund0=+T.fund_initial||0,expAll=expPaid+expUnpaid;
 const fundNow=fund0+rev-expPaid,fundAfter=fundNow-expUnpaid;
 const pnl=rev-expAll,arpu=ord?rev/ord:0;
 const dF=daily.filter(x=>inRange(x.d)),eF=expItems.filter(x=>inRange(x.d));
 const revR=dF.reduce((a,x)=>a+ +x.dt,0),ordR=dF.reduce((a,x)=>a+x.n,0);
 const expR=eF.reduce((a,x)=>a+ +x.amt,0),arpuR=ordR?revR/ordR:0;
 const full=dF.filter(x=>x.d!==today);
 const revPerDay=full.length?full.reduce((a,x)=>a+ +x.dt,0)/full.length:0;
 const revM=daily.filter(x=>mk(x.d)===curM).reduce((a,x)=>a+ +x.dt,0);
 const ordM=daily.filter(x=>mk(x.d)===curM).reduce((a,x)=>a+x.n,0);
 const projRev=dayN?revM/dayN*daysM:0;
 const revByM={},ordByM={},expByM={};
 daily.forEach(x=>{const m=mk(x.d);revByM[m]=(revByM[m]||0)+ +x.dt;ordByM[m]=(ordByM[m]||0)+x.n;});
 expItems.forEach(x=>{const m=mk(x.d);expByM[m]=(expByM[m]||0)+ +x.amt;});
 const months=[...new Set([...Object.keys(revByM),...Object.keys(expByM)])].sort();
 const byCat={},byGroup={};
 eF.forEach(x=>{byCat[x.c]=(byCat[x.c]||0)+ +x.amt;byGroup[x.g]=(byGroup[x.g]||0)+ +x.amt;});
 const planAgg={};
 planM.filter(p=>RANGE.mode==="all"||(p.m>=RANGE.from.slice(0,7)&&p.m<=RANGE.to.slice(0,7)))
  .forEach(p=>{const a=planAgg[p.k]||(planAgg[p.k]={n:0,dt:0});a.n+=p.n;a.dt+=+p.dt;});
 const nuM=(D.new_users||[]).filter(x=>mk(x.d)===curM).reduce((a,x)=>a+x.n,0);
 const nuF=(D.new_users||[]).filter(x=>inRange(x.d));
 const nuR=nuF.reduce((a,x)=>a+x.n,0);
 const buyF=(D.buyers_daily||[]).filter(x=>inRange(x.d));
 const visF=(D.traffic_daily||[]).filter(x=>inRange(x.d));
 const fdF=(D.funnel_daily||[]).filter(x=>inRange(x.d));
 const linkTao=fdF.reduce((a,x)=>a+ +x.tao,0),linkTra=fdF.reduce((a,x)=>a+ +x.tra,0),boDo=linkTao-linkTra;
 const doneRate=linkTao?linkTra/linkTao:0;
 const pSum=fdF.reduce((a,x)=>a+ +x.ps,0),pN=fdF.reduce((a,x)=>a+ +x.pn,0);
 const phutTb=pN?pSum/pN:null;
 const fdM=(D.funnel_daily||[]).filter(x=>mk(x.d)===curM);
 const linkTaoM=fdM.reduce((a,x)=>a+ +x.tao,0),linkTraM=fdM.reduce((a,x)=>a+ +x.tra,0);
 const hourAgg=Array.from({length:24},(_,h)=>({h,n:0,dt:0}));
 (D.hour_daily||[]).filter(x=>inRange(x.d)).forEach(x=>{const a=hourAgg[+x.h];a.n+=+x.n;a.dt+=+x.dt;});
 const hourTop=hourAgg.filter(x=>x.n>0).slice().sort((a,b)=>b.dt-a.dt).slice(0,5);
 return {S,subs,fn,daily,today,curM,prevM,dayN,daysM,rev,ord,expPaid,expUnpaid,fund0,expAll,fundNow,fundAfter,
  pnl,arpu,dF,eF,revR,ordR,expR,arpuR,revPerDay,revM,ordM,projRev,revByM,ordByM,expByM,months,byCat,byGroup,
  planAgg,nuM,nuR,nuF,buyF,visF,linkTao,linkTra,boDo,doneRate,phutTb,linkTaoM,linkTraM,
  unpaid:D.unpaid||[],hourAgg,byHour:hourTop};}

function hrShort(n){const p=(n||"").trim().split(/\s+/);return p[p.length-1]||n;}
function hrWd(m){const y=+m.slice(0,4),mm=+m.slice(5,7);
 const last=new Date(Date.UTC(y,mm,0)).getUTCDate();let n=0;
 for(let d=1;d<=last;d++){const w=new Date(Date.UTC(y,mm-1,d)).getUTCDay();if(w>=1&&w<=5)n++;}
 return{last:last,wd:n};}
function hrMonths(){const s=new Set((HR&&HR.att||[]).map(a=>a.d.slice(0,7)));
 (HR&&HR.staff||[]).forEach(x=>{if(x.unit==="khoan"&&x.start)s.add(x.start.slice(0,7));});
 return[...s].sort();}
function hrCalc(m){
 const st=(HR&&HR.staff)||[],att=((HR&&HR.att)||[]).filter(a=>a.d.slice(0,7)===m);
 const W=hrWd(m);
 return st.map(s=>{
  const rows=att.filter(a=>a.s===s.id);
  const khoan=s.unit==="khoan";
  const cc=khoan?0:W.wd*(s.spd||1);
  const rateAt=d=>(s.prob&&d<=s.prob)?(+s.rate||1):1;
  const unit=d=>cc?((+s.base)*rateAt(d))/cc:0;
  let luong=0,done=0,plan=0,oc=0;
  rows.forEach(a=>{luong+=unit(a.d);if(a.st==="da_lam")done++;else plan++;if(a.k==="tang_ca")oc++;});
  if(rows.length)luong+=(+s.allow||0);
  const on=khoan?!!(s.start&&s.start.slice(0,7)<=m):rows.length>0;
  if(khoan)luong=on?+s.base:0;
  const dg=cc?Math.round(((+s.base)*rateAt(m+"-28"))/cc):0;
  const byDay={};rows.forEach(a=>{(byDay[a.d]=byDay[a.d]||[]).push(a);});
  return{s:s,khoan:khoan,cc:cc,done:done,plan:plan,oc:oc,tong:done+plan,
   luong:Math.round(luong),dg:dg,on:on,byDay:byDay,last:W.last,wd:W.wd};
 }).filter(x=>x.on);
}
function hrRate(s,m){const e=eom(m+"-01");const a=(s.prob&&(m+"-01")<=s.prob)?+s.rate:1;
 const b=(s.prob&&e<=s.prob)?+s.rate:1;
 return a===b?pct(a):pct(a)+" → "+pct(b);}
function hrCell(p,ds,wk){
 if(p.khoan)return'<div class="cl" title="Khoán, không chấm công">·</div>';
 const a=p.byDay[ds];
 if(!a||!a.length)return'<div class="cl'+(wk?" we":"")+'"></div>';
 const full=p.s.unit==="ngay"?true:a.length>=2;
 const pl=a.some(x=>x.st!=="da_lam");
 const oc=a.some(x=>x.k==="tang_ca");
 const lab=p.s.unit==="ngay"?"N":(full?"CN":(a[0].sl==="sang"?"S":"C"));
 const tip=dm(ds)+" · "+(p.s.unit==="ngay"?"cả ngày":a.map(x=>x.sl==="sang"?"sáng":"chiều").join(" + "))
  +(oc?" · tăng ca":"")+" · "+(pl?"kế hoạch":"đã làm");
 return'<div class="cl '+(pl?"p":(full?"f":"h"))+(oc?" oc":"")+'" title="'+tip+'">'+lab+'</div>';
}

 function guessCat(t){
  const k=norm(t);if(!k)return null;
  if(LEARN[k])return Object.assign({src:"hist"},LEARN[k]);
  for(const [re,g,c] of RULES)if(re.test(k))return{g,c,src:"rule"};
  return{g:M,c:"Chưa phân loại",src:"none"};
 }
 async function rpc(fn,body){
  const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/"+fn,{method:"POST",
   headers:{apikey:ANON_KEY,Authorization:"Bearer "+ANON_KEY,"Content-Type":"application/json"},
   body:JSON.stringify(Object.assign({p_token:TOKEN},body||{}))});
  const txt=await r.text();let j=null;try{j=JSON.parse(txt);}catch(e){}
  if(!r.ok)throw new Error((j&&(j.message||j.hint))||txt||("Lỗi "+r.status));
  return j;
 }
