<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<title>Báo cáo tài chính — Aptis Kỳ Tích</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<style>
:root{color-scheme:light;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--soft:#f8fafc;
 --brand:#1f4e79;--brand-soft:#eef4fa;--up:#047857;--down:#b91c1c;
 --warn-bg:#fffbeb;--warn-line:#fcd34d;--warn-ink:#78350f}
*{box-sizing:border-box}
body{margin:0;padding:20px 18px 60px;background:#f1f5f9;color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:13.5px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto}
.sheet{background:#fff;border-radius:14px;padding:22px 24px 28px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
h1{font-size:21px;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:11.5px}
.hr{height:3px;background:var(--brand);border-radius:2px;margin:12px 0 14px}
#bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;
 padding:9px 12px;background:var(--brand-soft);border:1px solid #d6e3ef;border-radius:10px;margin-bottom:10px}
#bar label{font-size:11.5px;color:var(--muted);font-weight:600}
#bar button{font:inherit;font-size:12px;padding:5px 12px;border:1px solid #c9d8e6;background:#fff;
 color:var(--brand);border-radius:7px;cursor:pointer}
#bar button.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
#bar input[type=date]{font:inherit;font-size:12px;padding:4px 7px;border:1px solid #c9d8e6;border-radius:7px;background:#fff}
#bar .sep{width:1px;height:20px;background:#c9d8e6;margin:0 5px}
#tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
#tabs button{font:inherit;font-size:13px;font-weight:600;padding:8px 15px;border:none;background:none;
 color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-2px}
#tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.insight{background:var(--brand-soft);border:1px solid #d6e3ef;border-radius:9px;padding:9px 13px;
 font-size:12.5px;margin-bottom:14px;line-height:1.5}
.insight b{color:var(--brand)}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.sec-h h2{font-size:12px;margin:0;color:var(--brand);text-transform:uppercase;letter-spacing:.7px;font-weight:800}
.sec-h .tag{font-size:11px;color:var(--muted)}
.row{display:grid;gap:10px}
.c2{grid-template-columns:repeat(2,1fr)}.c4{grid-template-columns:repeat(4,1fr)}.c5{grid-template-columns:repeat(5,1fr)}
.card{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--soft)}
.card .lab{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.card .val{font-size:18px;font-weight:750;margin-top:4px;letter-spacing:-.4px}
.card .note{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.hero .card{background:linear-gradient(180deg,#f7fbff,#fff);border-color:#cddcea;padding:14px 16px}
.hero .val{font-size:23px}
.pos{color:var(--up)}.neg{color:var(--down)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--brand);color:#fff;text-align:left;padding:7px 10px;font-size:11px;font-weight:600;
 text-transform:uppercase;letter-spacing:.3px}
th:first-child{border-radius:8px 0 0 0}th:last-child{border-radius:0 8px 0 0}
td{padding:6px 10px;border-bottom:1px solid #f1f5f9}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:750;border-top:2px solid var(--brand);background:var(--brand-soft)}
.bar-cell{position:relative}.bar-cell .bg{position:absolute;left:0;top:2px;bottom:2px;background:#e8f0f7;border-radius:4px}
.bar-cell span{position:relative}
.chart{height:250px;position:relative;border:1px solid var(--line);border-radius:11px;padding:10px 8px 4px}
.split{display:grid;gap:18px}.s11{grid-template-columns:1fr 1fr}.s64{grid-template-columns:1.5fr 1fr}
.fn{display:flex;flex-direction:column;gap:7px}
.fn-row{display:grid;grid-template-columns:104px 1fr 128px;align-items:center;gap:10px}
.fn-lab{font-size:11.5px;color:var(--muted);font-weight:600;text-align:right}
.fn-track{background:var(--soft);border:1px solid var(--line);border-radius:7px;height:30px;overflow:hidden}
.fn-fill{height:100%;background:linear-gradient(90deg,#1f4e79,#2f6ea5);display:flex;align-items:center;
 padding-left:11px;color:#fff;font-size:12px;font-weight:700;min-width:52px}
.fn-side{font-size:11.5px;color:var(--muted)}.fn-side b{color:var(--ink)}
.note-box{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:9px;padding:10px 12px;
 font-size:11.5px;color:var(--warn-ink);line-height:1.55;margin-top:10px}
.foot{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);color:#94a3b8;font-size:10.5px}
.center{min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center}
.box{background:#fff;border-radius:14px;padding:34px 30px;max-width:460px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.box h2{margin:0 0 8px;font-size:17px;color:var(--brand)}
.box p{margin:0;color:var(--muted);font-size:13px}
.spin{width:26px;height:26px;border:3px solid #dbe6f0;border-top-color:var(--brand);border-radius:50%;
 animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.muted{color:#94a3b8;font-style:italic}
@media(max-width:900px){.split{grid-template-columns:1fr!important}.c4,.c5{grid-template-columns:repeat(2,1fr)}
 body{padding:12px 10px 40px}.sheet{padding:16px 14px 20px}}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="center"><div class="box"><div class="spin"></div>
    <h2>Đang tải báo cáo</h2><p>Số liệu lấy trực tiếp từ hệ thống, vui lòng đợi vài giây.</p></div></div>
</div>

<script>
const SUPABASE_URL="https://bacoamhbatqpxatrrflz.supabase.co";
const ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhY29hbWhiYXRxcHhhdHJyZmx6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxMTgyODgsImV4cCI6MjA4ODY5NDI4OH0.BcFLY1mFlFxCK7E0E89iLlh4am3mEXkbYZaFJ4O_mpw";
const PLAN_LABEL={day:"1 ngày",week:"1 tuần",month:"1 tháng",quarter:"3 tháng",half_year:"6 tháng",lifetime:"Trọn đời"};
const vnd=n=>(n==null||!isFinite(n)?"–":Math.round(n).toLocaleString("vi-VN")+"đ");
const num=n=>(n==null||!isFinite(n)?"–":Math.round(n).toLocaleString("vi-VN"));
const pct=n=>(isFinite(n)?(n*100).toFixed(1)+"%":"–");
const dm=d=>d.split("-").reverse().join("/");
const mk=d=>d.slice(0,7);
const card=(l,v,nt,cls="")=>`<div class="card"><div class="lab">${l}</div><div class="val ${cls}">${v}</div><div class="note">${nt||""}</div></div>`;
let D=null,RANGE={mode:"month",from:null,to:null},TAB="overview",charts=[];
function fail(t,m){document.getElementById("root").innerHTML=
 `<div class="center"><div class="box"><h2>${t}</h2><p>${m}</p></div></div>`;}
const inRange=d=>RANGE.mode==="all"?true:(d>=RANGE.from&&d<=RANGE.to);
function rangeLabel(){
 if(RANGE.mode==="all")return "toàn thời gian";
 if(RANGE.mode==="month")return "tháng "+RANGE.from.slice(0,7);
 if(RANGE.mode==="30d")return "30 ngày gần nhất";
 return dm(RANGE.from)+" → "+dm(RANGE.to);}
function addDays(s,k){const p=s.split("-").map(Number);const dt=new Date(Date.UTC(p[0],p[1]-1,p[2]));
 dt.setUTCDate(dt.getUTCDate()+k);return dt.toISOString().slice(0,10);}
function mkChart(id,cfg){const el=document.getElementById(id);if(el)charts.push(new Chart(el,cfg));}

function shell(){
 const today=D.today,m0=today.slice(0,8)+"01";
 if(RANGE.mode==="month"&&!RANGE.from){RANGE.from=m0;RANGE.to=today;}
 const tabs=[["overview","Tổng quan"],["kpi","KPI tháng"],["revenue","Doanh thu"],["customers","Khách hàng"],["costs","Chi phí"]];
 return `<div class="sheet">
  <h1>Báo cáo tài chính — Aptis Kỳ Tích</h1>
  <div class="sub">Số liệu trực tiếp từ hệ thống, cập nhật lúc mở trang · Đơn vị VND · Mọi mốc ngày theo giờ Việt Nam
   · Người xem: <b>${D.viewer||"–"}</b> · ${D.as_of||""}</div>
  <div class="hr"></div>
  <div id="bar">
   <label>Kỳ báo cáo</label>
   <button data-m="month">Tháng này</button>
   <button data-m="30d">30 ngày</button>
   <button data-m="all">Toàn thời gian</button>
   <span class="sep"></span>
   <label>Từ</label><input type="date" id="f" value="${RANGE.from||m0}" min="2026-03-01" max="${today}">
   <label>đến</label><input type="date" id="t" value="${RANGE.to||today}" min="2026-03-01" max="${today}">
   <button id="go">Áp dụng</button>
  </div>
  <div id="tabs">${tabs.map(([k,l])=>`<button data-t="${k}" class="${k===TAB?"on":""}">${l}</button>`).join("")}</div>
  <div id="body"></div>
  <div class="foot">Doanh thu lấy từ cổng thanh toán PayOS, chỉ tính đơn đã thanh toán. Chi phí lấy từ sổ kế toán nội bộ.
  Quỹ Kỳ Tích gồm vốn góp ban đầu cộng doanh thu, trừ các khoản đã chi.
  Trang này dành riêng cho ${D.viewer||"cổ đông"}, vui lòng không chuyển tiếp đường dẫn.</div>
 </div>`;}

function wire(){
 const today=D.today,m0=today.slice(0,8)+"01",d30=addDays(today,-29);
 document.querySelectorAll("#bar button[data-m]").forEach(b=>{
  if(b.dataset.m===RANGE.mode)b.classList.add("on");
  b.onclick=()=>{const m=b.dataset.m;
   if(m==="all")RANGE={mode:"all",from:null,to:null};
   if(m==="month")RANGE={mode:"month",from:m0,to:today};
   if(m==="30d")RANGE={mode:"30d",from:d30,to:today};
   render();};});
 document.getElementById("go").onclick=()=>{
  RANGE={mode:"custom",from:document.getElementById("f").value,to:document.getElementById("t").value};render();};
 document.querySelectorAll("#tabs button").forEach(b=>{b.onclick=()=>{TAB=b.dataset.t;render();};});}

function calc(){
 const S=D.settings||{},T=D.totals||{},subs=D.subs||{},fn=D.funnel||{};
 const daily=D.daily||[],planM=D.plan_monthly||[],expItems=D.exp_items||[];
 const today=D.today,curM=today.slice(0,7);
 const dayN=+today.slice(8,10);
 const daysM=new Date(+today.slice(0,4),+today.slice(5,7),0).getDate();
 const prevM=(()=>{const y=+today.slice(0,4),m=+today.slice(5,7);
   return m===1?(y-1)+"-12":y+"-"+String(m-1).padStart(2,"0");})();
 const rev=+T.rev||0,ord=+T.orders||0,expPaid=+T.exp_paid||0,expUnpaid=+T.exp_unpaid||0;
 const fund0=+T.fund_initial||0,expAll=expPaid+expUnpaid;
 const fundNow=fund0+rev-expPaid,fundAfter=fundNow-expUnpaid;
 const pnl=rev-expAll,arpu=ord?rev/ord:0;
 const dF=daily.filter(x=>inRange(x.d)),eF=expItems.filter(x=>inRange(x.d));
 const revR=dF.reduce((a,x)=>a+ +x.dt,0),ordR=dF.reduce((a,x)=>a+x.n,0);
 const expR=eF.reduce((a,x)=>a+ +x.amt,0),arpuR=ordR?revR/ordR:0;
 const full=dF.filter(x=>x.d!==today);
 const revPerDay=full.length?full.reduce((a,x)=>a+ +x.dt,0)/full.length:0;
 const revM=daily.filter(x=>mk(x.d)===curM).reduce((a,x)=>a+ +x.dt,0);
 const ordM=daily.filter(x=>mk(x.d)===curM).reduce((a,x)=>a+x.n,0);
 const projRev=dayN?revM/dayN*daysM:0;
 const revByM={},ordByM={},expByM={};
 daily.forEach(x=>{const m=mk(x.d);revByM[m]=(revByM[m]||0)+ +x.dt;ordByM[m]=(ordByM[m]||0)+x.n;});
 expItems.forEach(x=>{const m=mk(x.d);expByM[m]=(expByM[m]||0)+ +x.amt;});
 const months=[...new Set([...Object.keys(revByM),...Object.keys(expByM)])].sort();
 const byCat={},byGroup={};
 eF.forEach(x=>{byCat[x.c]=(byCat[x.c]||0)+ +x.amt;byGroup[x.g]=(byGroup[x.g]||0)+ +x.amt;});
 const planAgg={};
 planM.filter(p=>RANGE.mode==="all"||(p.m>=RANGE.from.slice(0,7)&&p.m<=RANGE.to.slice(0,7)))
  .forEach(p=>{const a=planAgg[p.k]||(planAgg[p.k]={n:0,dt:0});a.n+=p.n;a.dt+=+p.dt;});
 const nuM=(D.new_users||[]).filter(x=>mk(x.d)===curM).reduce((a,x)=>a+x.n,0);
 const nuR=(D.new_users||[]).filter(x=>inRange(x.d)).reduce((a,x)=>a+x.n,0);
 const linkTao=+fn.link_tao||0,linkTra=+fn.link_tra||0,boDo=linkTao-linkTra;
 const doneRate=linkTao?linkTra/linkTao:0;
 return {S,subs,fn,daily,today,curM,prevM,dayN,daysM,rev,ord,expPaid,expUnpaid,fund0,expAll,fundNow,fundAfter,
  pnl,arpu,dF,eF,revR,ordR,expR,arpuR,revPerDay,revM,ordM,projRev,revByM,ordByM,expByM,months,byCat,byGroup,
  planAgg,nuM,nuR,linkTao,linkTra,boDo,doneRate,unpaid:D.unpaid||[],byHour:(D.by_hour||[]).slice(0,5)};}

function tOverview(C){
 const show=C.dF.slice(-62);
 document.getElementById("body").innerHTML=`
 <div class="sec-h"><h2>Sức khoẻ tài chính</h2><span class="tag">kỳ: ${rangeLabel()}</span></div>
 <div class="row c4 hero">
  ${card("Tổng quỹ Kỳ Tích",vnd(C.fundNow),`${vnd(C.fund0)} vốn + ${vnd(C.rev)} doanh thu − ${vnd(C.expPaid)} đã chi`)}
  ${card("Doanh thu kỳ này",vnd(C.revR),`${num(C.ordR)} đơn · ARPU ${vnd(C.arpuR)}`)}
  ${card("Lãi / lỗ kỳ này",vnd(C.revR-C.expR),`chi phí ${vnd(C.expR)}`,C.revR-C.expR>=0?"pos":"neg")}
  ${card("Lãi / lỗ luỹ kế",vnd(C.pnl),`${vnd(C.rev)} thu − ${vnd(C.expAll)} chi`,C.pnl>=0?"pos":"neg")}
 </div>
 <div class="row c4" style="margin-top:10px">
  ${card("Doanh số TB / ngày",vnd(C.revPerDay),"đã loại hôm nay")}
  ${card("Dự kiến hết tháng "+C.curM,vnd(C.projRev),"theo run-rate hiện tại")}
  ${card("Quỹ sau khi trả hết nợ",vnd(C.fundAfter),C.expUnpaid?`còn ${vnd(C.expUnpaid)} chưa TT`:"không còn công nợ")}
  ${card("Người dùng mới trong kỳ",num(C.nuR),"đăng ký tài khoản")}
 </div>
 <div class="sec-h"><h2>Doanh thu theo ngày</h2><span class="tag">${rangeLabel()}</span></div>
 <div class="chart"><canvas id="c1"></canvas></div>`;
 mkChart("c1",{type:"bar",
  data:{labels:show.map(x=>dm(x.d).slice(0,5)),datasets:[{data:show.map(x=>+x.dt),
   backgroundColor:show.map(x=>x.d===C.today?"#94a3b8":"#1f4e79"),borderRadius:4,maxBarThickness:40}]},
  options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
   tooltip:{callbacks:{label:c=>vnd(c.parsed.y)+" · "+show[c.dataIndex].n+" đơn"}}},
   scales:{y:{grid:{color:"#f1f5f9"},ticks:{callback:v=>(v/1e6).toFixed(1)+"tr",font:{size:11}}},
    x:{grid:{display:false},ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:16,font:{size:11}}}}}});}

function tKPI(C){
 const KPI=+(C.S["kpi_"+C.curM.replace("-","")]||0);
 if(!KPI){document.getElementById("body").innerHTML=
  `<div class="insight">Chưa đặt KPI cho tháng ${C.curM}.</div>`;return;}
 const daysLeft=Math.max(C.daysM-C.dayN,1);
 const done=C.revM/KPI,remaining=Math.max(KPI-C.revM,0);
 const rateNow=C.dayN?C.revM/C.dayN:0,needPerDay=remaining/daysLeft;
 const mult=rateNow?needPerDay/rateNow:null;
 const prevDaily=C.daily.filter(x=>mk(x.d)===C.prevM);
 const prevTot=prevDaily.reduce((a,x)=>a+ +x.dt,0);
 const prevCum=prevDaily.filter(x=>+x.d.slice(8,10)<=C.dayN).reduce((a,x)=>a+ +x.dt,0);
 const paceExp=prevTot?prevCum/prevTot:C.dayN/C.daysM;
 const onPace=C.revM/(KPI*paceExp);
 const L=C.linkTao,P=C.linkTra;
 const arpuM=C.ordM?C.revM/C.ordM:0;
 const b=C.nuM?L/C.nuM:0,c=L?P/L:0;
 const chain=[
  ["Đăng ký mới / ngày",num(C.nuM/Math.max(C.dayN,1)),mult?num(C.nuM/Math.max(C.dayN,1)*mult)+" /ngày":"–"],
  ["Đăng ký → bấm mua",pct(b),mult?pct(Math.min(b*mult,1)):"–"],
  ["Bấm mua → trả tiền",pct(c),mult?pct(Math.min(c*mult,1)):"–"],
  ["ARPU",vnd(arpuM),mult?vnd(arpuM*mult):"–"]];
 const feas=mult==null?"":mult<=1.3?`<b class="pos">Khả thi</b> nếu giữ đà và nhích nhẹ.`
  :mult<=2?`<b>Căng nhưng với được</b> — cần tăng tốc ×${mult.toFixed(1)}.`
  :`<b class="neg">Rất khó với đà hiện tại</b> — cần ×${mult.toFixed(1)} mỗi ngày còn lại.`;
 document.getElementById("body").innerHTML=`
 <div class="insight">KPI tháng ${C.curM}: <b>${vnd(KPI)}</b>. Đã đạt <b>${pct(done)}</b> (${vnd(C.revM)}) sau ${C.dayN}/${C.daysM} ngày.
 Theo nhịp tháng trước, tới ngày này thường đạt <b>${pct(paceExp)}</b> tháng — đang chạy ở <b class="${onPace>=1?"pos":"neg"}">${pct(onPace)} pace</b>. ${feas}</div>
 <div class="row c4 hero">
  ${card("KPI tháng",vnd(KPI),"mục tiêu do công ty đặt")}
  ${card("Thực đạt",vnd(C.revM),`${pct(done)} KPI · ${C.dayN}/${C.daysM} ngày`,onPace>=1?"pos":"neg")}
  ${card("Còn thiếu",vnd(remaining),`${daysLeft} ngày còn lại`)}
  ${card("Cần / ngày từ giờ",vnd(needPerDay),mult?`×${mult.toFixed(1)} nhịp hiện tại (${vnd(rateNow)}/ngày)`:"",mult&&mult>2?"neg":"")}
 </div>
 <div class="sec-h"><h2>Tiến độ so với nhịp chuẩn</h2><span class="tag">nhịp chuẩn = đường cong tháng ${C.prevM.slice(5)}</span></div>
 <div class="fn">
  <div class="fn-row"><div class="fn-lab">Pace chuẩn</div>
   <div class="fn-track"><div class="fn-fill" style="width:${Math.min(paceExp*100,100)}%;background:#94a3b8">${pct(paceExp)}</div></div>
   <div class="fn-side">mức "đúng nhịp" tới hôm nay</div></div>
  <div class="fn-row"><div class="fn-lab">Đang ở</div>
   <div class="fn-track"><div class="fn-fill" style="width:${Math.min(done*100,100)}%">${pct(done)}</div></div>
   <div class="fn-side">${onPace>=1?"<b class='pos'>trước nhịp</b>":"<b class='neg'>sau nhịp</b>"}</div></div>
 </div>
 <div class="sec-h"><h2>Các mắt xích để đạt KPI</h2><span class="tag">cột "cần" = nếu chỉ vặn mắt xích đó, giữ nguyên phần còn lại</span></div>
 <table><thead><tr><th>Mắt xích</th><th class="n">Hiện tại (tháng này)</th><th class="n">Cần để đạt KPI</th></tr></thead><tbody>
 ${chain.map(r=>`<tr><td>${r[0]}</td><td class="n">${r[1]}</td><td class="n"><b>${r[2]}</b></td></tr>`).join("")}
 </tbody></table>
 <div class="note-box">Doanh thu = Đăng ký × Bấm mua × Hoàn tất × ARPU. Không cần vặn tất cả — cải thiện 1-2 mắt xích yếu nhất thường hiệu quả hơn cào đều.</div>`;}

 const show=C.dF.slice(-62);
 document.getElementById("body").innerHTML=`
 <div class="sec-h"><h2>Doanh thu theo ngày</h2><span class="tag">${rangeLabel()}</span></div>
 <div class="chart"><canvas id="c1"></canvas></div>
 <div class="split s11" style="margin-top:16px">
  <div><div class="sec-h"><h2>Kết quả theo tháng</h2><span class="tag">toàn thời gian</span></div>
   <table><thead><tr><th>Tháng</th><th class="n">Đơn</th><th class="n">Doanh thu</th><th class="n">Chi phí</th><th class="n">Lãi/lỗ</th></tr></thead><tbody>
   ${C.months.map(m=>{const r=C.revByM[m]||0,e=C.expByM[m]||0,d=r-e;
    return `<tr><td>${m}</td><td class="n">${C.ordByM[m]||0}</td><td class="n">${vnd(r)}</td><td class="n">${vnd(e)}</td><td class="n ${d>=0?"pos":"neg"}">${vnd(d)}</td></tr>`}).join("")}
   <tr class="tot"><td>Tổng</td><td class="n">${num(C.ord)}</td><td class="n">${vnd(C.rev)}</td><td class="n">${vnd(C.expAll)}</td><td class="n ${C.pnl>=0?"pos":"neg"}">${vnd(C.pnl)}</td></tr>
   </tbody></table></div>
  <div><div class="sec-h"><h2>Theo gói</h2><span class="tag">${rangeLabel()}</span></div>
   <table><thead><tr><th>Gói</th><th class="n">Đơn</th><th class="n">Doanh thu</th><th class="n">% DT</th><th class="n">ARPU</th></tr></thead><tbody>
   ${Object.entries(C.planAgg).sort((a,b)=>b[1].dt-a[1].dt).map(([k,v])=>
    `<tr><td>${PLAN_LABEL[k]||k}</td><td class="n">${v.n}</td><td class="n">${vnd(v.dt)}</td><td class="n">${pct(v.dt/planRev)}</td><td class="n">${vnd(v.dt/v.n)}</td></tr>`).join("")
    ||'<tr><td colspan="5" class="muted">Không có đơn trong kỳ</td></tr>'}
   </tbody></table>
   <div class="sec-h"><h2>Giờ bán chạy</h2><span class="tag">tháng ${C.curM}</span></div>
   <table><thead><tr><th>Khung giờ</th><th class="n">Đơn</th><th class="n">Doanh thu</th></tr></thead><tbody>
   ${C.byHour.map(h=>`<tr><td>${String(h.h).padStart(2,"0")}:00 – ${String(h.h).padStart(2,"0")}:59</td><td class="n">${h.n}</td><td class="n">${vnd(+h.dt)}</td></tr>`).join("")||'<tr><td colspan="3" class="muted">Chưa có dữ liệu</td></tr>'}
   </tbody></table></div>
 </div>`;
 mkChart("c1",{type:"bar",
  data:{labels:show.map(x=>dm(x.d).slice(0,5)),datasets:[{data:show.map(x=>+x.dt),
   backgroundColor:show.map(x=>x.d===C.today?"#94a3b8":"#1f4e79"),borderRadius:4,maxBarThickness:40}]},
  options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
   tooltip:{callbacks:{label:c=>vnd(c.parsed.y)+" · "+show[c.dataIndex].n+" đơn"}}},
   scales:{y:{grid:{color:"#f1f5f9"},ticks:{callback:v=>(v/1e6).toFixed(1)+"tr",font:{size:11}}},
    x:{grid:{display:false},ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:16,font:{size:11}}}}}});}

function tCustomers(C){
 const s=C.subs;
 const fnMax=Math.max(C.nuM,C.linkTao,1);
 const fnRow=(lab,v,side)=>`<div class="fn-row"><div class="fn-lab">${lab}</div>
  <div class="fn-track"><div class="fn-fill" style="width:${Math.max(5,v/fnMax*100)}%">${num(v)}</div></div>

   <div class="fn">

   <div class="row c2">
    ${card("Tổng người dùng",num(s.tong_user))}

    ${card("Hết hạn 30 ngày tới",num(s.het_han_30d),"cần chăm gia hạn")}
    ${card("Tỉ lệ mua lại",pct(s.da_mua?s.mua_lai/s.da_mua:0),`${s.mua_lai}/${s.da_mua} mua ≥2 lần`)}
   </div></div>
 </div>`;}

 document.getElementById("body").innerHTML=`

   ${Object.entries(C.byGroup).sort((a,b)=>b[1]-a[1]).map(([k,v])=>

   <table><thead><tr><th>Ngày</th><th>Khoản</th><th class="n">Số tiền</th></tr></thead><tbody>
   ${C.unpaid.map(u=>`<tr><td>${dm(u.d)}</td><td>${u.t}</td><td class="n neg">${vnd(+u.amt)}</td></tr>`).join("")}

  </div>

function render(){
 charts.forEach(c=>c.destroy());charts=[];
 document.getElementById("root").innerHTML=shell();
 wire();
 const C=calc();
 ({overview:tOverview,kpi:tKPI,revenue:tRevenue,customers:tCustomers,costs:tCosts}[TAB]||tOverview)(C);}

async function load(){
 const t=new URLSearchParams(location.search).get("t");
 if(!t)return fail("Thiếu mã truy cập","Đường dẫn không đầy đủ. Vui lòng dùng đúng link đã được gửi cho bạn.");
 let r,lastErr;
 for(let i=0;i<3;i++){
  try{
   r=await fetch(SUPABASE_URL+"/rest/v1/rpc/finance_report",{
    method:"POST",
    headers:{apikey:ANON_KEY,Authorization:"Bearer "+ANON_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({p_token:t})});
   if(r.ok)break;
   if(r.status>=400&&r.status<500)break;
  }catch(e){lastErr=e;}
  await new Promise(res=>setTimeout(res,700*(i+1)));
 }
 if(!r)return fail("Không kết nối được","Vui lòng kiểm tra mạng rồi thử lại.");
 if(!r.ok)return fail("Link không còn hiệu lực","Đường dẫn này đã bị thu hồi hoặc hết hạn. Liên hệ Bùi Khánh Thiện để lấy link mới.");
 D=await r.json();
 render();}
load();
</script>
