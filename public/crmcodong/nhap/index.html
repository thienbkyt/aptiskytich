<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<title>Nhập chi phí — Aptis Kỳ Tích</title>
<style>
:root{color-scheme:light;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--soft:#f8fafc;
 --brand:#1f4e79;--brand-soft:#eef4fa;--up:#047857;--down:#b91c1c;
 --warn-bg:#fffbeb;--warn-line:#fcd34d;--warn-ink:#78350f}
*{box-sizing:border-box}
body{margin:0;padding:20px 18px 60px;background:#f1f5f9;color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:13.5px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto}
.sheet{background:#fff;border-radius:14px;padding:22px 24px 28px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
h1{font-size:21px;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:11.5px}
.sub a{color:var(--brand);font-weight:600;text-decoration:none}
.hr{height:3px;background:var(--brand);border-radius:2px;margin:12px 0 16px}
.row{display:grid;gap:10px}.c3{grid-template-columns:repeat(3,1fr)}
.card{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--soft)}
.card .lab{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.card .val{font-size:19px;font-weight:750;margin-top:3px;letter-spacing:-.4px}
.card .note{font-size:10.5px;color:var(--muted);margin-top:2px}
.neg{color:var(--down)}.pos{color:var(--up)}.amber{color:#b45309}
.layout{display:grid;grid-template-columns:400px 1fr;gap:20px;margin-top:18px;align-items:start}
.form{border:1px solid #cddcea;border-radius:12px;padding:16px;background:linear-gradient(180deg,#f7fbff,#fff);position:sticky;top:14px}
.form h2,.list h2{font-size:12px;margin:0 0 12px;color:var(--brand);text-transform:uppercase;letter-spacing:.7px;font-weight:800}
.edit-banner{display:none;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);
 border-radius:8px;padding:7px 10px;font-size:12px;margin-bottom:10px;align-items:center;justify-content:space-between;gap:8px}
.edit-banner.on{display:flex}
.f{margin-bottom:11px}
.f>label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.f input[type=text],.f input[type=date],.f select{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid #c9d8e6;
 border-radius:8px;background:#fff;color:var(--ink);outline:none}
.f input:focus,.f select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,78,121,.12)}
.f input.bad{border-color:var(--down);box-shadow:0 0 0 3px rgba(185,28,28,.1)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid #c9d8e6;border-radius:8px;overflow:hidden;background:#fff}
.seg button{flex:1;font:inherit;font-size:13px;padding:8px 6px;border:none;background:none;color:var(--brand);cursor:pointer;font-weight:600}
.seg button+button{border-left:1px solid #c9d8e6}
.seg button.on{background:var(--brand);color:#fff}
.seg.st button.on[data-v="false"]{background:#b45309}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px;min-height:17px}
.hint b{color:var(--ink)}
.hint .warn{color:#b45309;font-weight:650}
.hint a{color:var(--brand);cursor:pointer;font-weight:600;text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font:inherit;font-size:11.5px;padding:3px 9px;border:1px solid #c9d8e6;background:#fff;color:var(--brand);border-radius:999px;cursor:pointer}
.chip:hover{background:var(--brand-soft)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.btns{display:flex;gap:8px;margin-top:14px}
.btn{font:inherit;font-size:14px;font-weight:700;padding:10px 14px;border-radius:9px;border:1px solid var(--brand);
 background:var(--brand);color:#fff;cursor:pointer;flex:1}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:#fff;color:var(--brand);flex:0 0 auto}
.kbd{font-size:10.5px;color:var(--muted);text-align:center;margin-top:7px}
.list .tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.list .tools input[type=text]{font:inherit;font-size:12.5px;padding:6px 10px;border:1px solid #c9d8e6;border-radius:8px;min-width:200px;flex:1}
.list .tools label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--brand);color:#fff;text-align:left;padding:7px 9px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
th:first-child{border-radius:8px 0 0 0}th:last-child{border-radius:0 8px 0 0}
td{padding:7px 9px;border-bottom:1px solid #f1f5f9;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.day td{background:var(--soft);font-weight:700;font-size:11.5px;color:var(--brand);padding:5px 9px}
tr.day td .dt{float:right;font-weight:650;color:var(--muted);font-variant-numeric:tabular-nums}
tr.it:hover td{background:#fafcff}
tr.it.editing td{background:var(--warn-bg)}
tr.it.flash td{animation:fl 1.6s ease-out}
@keyframes fl{0%{background:#d1fae5}100%{background:transparent}}
.desc{font-weight:600}
.desc small{display:block;font-weight:400;color:var(--muted);font-size:11px;word-break:break-all;max-width:360px}
.cat{font-size:11px;color:var(--muted)}
.cat.unk{color:#b45309;font-weight:650}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.badge.p{background:#ecfdf5;color:var(--up);border-color:#a7f3d0}
.badge.u{background:#fffbeb;color:#b45309;border-color:#fcd34d}
.badge:hover{filter:brightness(.96)}
.act{white-space:nowrap;text-align:right}
.act button{font:inherit;font-size:11.5px;padding:3px 8px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;color:var(--brand)}
.act button.del{color:var(--down)}
.act button+button{margin-left:4px}
.empty{padding:26px;text-align:center;color:var(--muted)}
details.log{margin-top:18px;border:1px solid var(--line);border-radius:10px;padding:10px 13px}
details.log summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--brand)}
.lg{font-size:12px;padding:5px 0;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:86px 70px 1fr;gap:8px}
.lg:last-child{border-bottom:none}
.lg .t{color:var(--muted);font-variant-numeric:tabular-nums}
.lg .a{font-weight:700}.lg .a.them{color:var(--up)}.lg .a.sua{color:#b45309}.lg .a.xoa{color:var(--down)}.lg .a.khoi_phuc{color:var(--brand)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
 background:#0f172a;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(15,23,42,.25);
 transition:all .2s;display:flex;gap:12px;align-items:center;z-index:50;max-width:92vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast.err{background:var(--down)}
.toast button{font:inherit;font-size:12.5px;font-weight:700;background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:7px;padding:3px 10px;cursor:pointer}
.center{min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center}
.box{background:#fff;border-radius:14px;padding:34px 30px;max-width:460px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.box h2{margin:0 0 8px;font-size:17px;color:var(--brand)}.box p{margin:0;color:var(--muted);font-size:13px}
.spin{width:26px;height:26px;border:3px solid #dbe6f0;border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.cat.m{display:none}
@media(max-width:900px){.cat.m{display:block}.layout{grid-template-columns:1fr}.form{position:static}.c3{grid-template-columns:1fr 1fr}
 body{padding:12px 10px 40px}.sheet{padding:16px 14px 20px}.hide-m{display:none}}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="center"><div class="box"><div class="spin"></div><h2>Đang tải</h2><p>Lấy danh sách chi phí từ hệ thống...</p></div></div>
</div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn" style="display:none"></button></div>

<script>
const SUPABASE_URL="https://bacoamhbatqpxatrrflz.supabase.co";
const ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhY29hbWhiYXRxcHhhdHJyZmx6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxMTgyODgsImV4cCI6MjA4ODY5NDI4OH0.BcFLY1mFlFxCK7E0E89iLlh4am3mEXkbYZaFJ4O_mpw";
const TOKEN=new URLSearchParams(location.search).get("t");
const H="Hạ tầng & Tool",M="Marketing & Vận hành",P="Nhân sự / CTV";

/* ---------- tiện ích ---------- */
const vnd=n=>(n==null||!isFinite(n)?"–":Math.round(n).toLocaleString("vi-VN")+"đ");
const dm=d=>d?d.split("-").reverse().join("/"):"";
const short=a=>(a>=1e6&&a%1e5===0)?(a/1e6).toLocaleString("vi-VN")+"tr":((a<1e6&&a%1e3===0)?(a/1e3)+"k":vnd(a));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TH=["CN","T2","T3","T4","T5","T6","T7"];
const thu=d=>{const p=d.split("-").map(Number);return TH[new Date(Date.UTC(p[0],p[1]-1,p[2])).getUTCDay()];};
const norm=s=>(s||"").normalize("NFC").toLowerCase().trim().replace(/\s+/g," ");

/* Số tiền: 100k · 1tr2 · 1.5tr · 5.832.164 · 450000 */
function parseAmt(s){
  s=(s||"").toLowerCase().replace(/\s|đ|vnd|vnđ/g,"");
  if(!s)return null;
  let m=s.match(/^(\d+(?:[.,]\d+)?)(tr|m|triệu)(\d{1,3})?$/);
  if(m){let v=parseFloat(m[1].replace(",","."))*1e6;if(m[3])v+=(+m[3])*Math.pow(10,6-m[3].length);return Math.round(v);}
  m=s.match(/^(\d+(?:[.,]\d+)?)(k|nghìn|ngàn)$/);
  if(m)return Math.round(parseFloat(m[1].replace(",","."))*1e3);
  const d=s.replace(/[.,]/g,"");
  return /^\d+$/.test(d)?+d:null;
}

/* Danh mục: ưu tiên học từ lịch sử (cùng nội dung đã từng nhập), sau đó mới dùng luật */
const RULES=[
  [/cloud ai|\bapi\b|elevenlab|openai|gemini|gpt/,H,"AI API (OpenAI/Claude/Gemini)"],
  [/^(topup |nạp |mua thêm )?lovable|lovable/,H,"Lovable credits"],
  [/^claude/,H,"Claude subscription"],
  [/tên miền|domain|hosting/,H,"Domain & hosting"],
  [/capcut|canva|figma|\btool\b/,H,"Tool khác (Canva, Figma...)"],
  [/thưởng|review/,M,"Thưởng review"],
  [/tiktoker|\bkoc\b|\bkol\b|affiliate|booking/,M,"KOL / KOC / affiliate"],
  [/\bads\b|quảng cáo|\bvia\b|thuê gr|google|facebook ads|tiktok ads/,M,"Quảng cáo (FB/Google/TikTok)"],
  [/thuê vp|thuê văn phòng|^cọc|tiền nhà|điện nước/,M,"Thuê văn phòng & cọc"],
  [/^mạng|internet|wifi/,M,"Mạng internet"],
  [/^(phông xanh|bàn ghế|cây|kệ|sofa|thảm|tranh|đèn rọi|bảng|mic|đèn|nước uống)$|đồ văn phòng|^mua nước|thiết bị|vật tư/,M,"Thiết bị / vật tư"],
  [/hoàn tiền/,M,"Chi phí vận hành khác"],
  [/lương/,P,"Lương nhân sự"],
  [/^thi$|tiền thi|lệ phí thi|đi thi/,P,"Đi thi thật (lấy đề)"],
  [/mua đề|\bkey\b/,P,"Mua đề / key"],
  [/mua video|trả video/,P,"Mua nội dung / video"],
  [/logo|design|edit|thiết kế|content|\bpost\b|dựng video/,P,"Thuê ngoài (design/content/dev)"]
];
let LEARN={};   // nội dung đã chuẩn hoá -> {g,c} của lần nhập gần nhất
function guessCat(t){
  const k=norm(t);
  if(!k)return null;
  if(LEARN[k])return Object.assign({src:"hist"},LEARN[k]);
  for(const [re,g,c] of RULES)if(re.test(k))return{g,c,src:"rule"};
  return{g:M,c:"Chưa phân loại",src:"none"};
}

/* ---------- API ---------- */
async function rpc(fn,body){
  const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/"+fn,{method:"POST",
    headers:{apikey:ANON_KEY,Authorization:"Bearer "+ANON_KEY,"Content-Type":"application/json"},
    body:JSON.stringify(Object.assign({p_token:TOKEN},body||{}))});
  const txt=await r.text();let j=null;try{j=JSON.parse(txt);}catch(e){}
  if(!r.ok)throw new Error((j&&(j.message||j.hint))||txt||("Lỗi "+r.status));
  return j;
}

/* ---------- state ---------- */
let D=null,ITEMS=[],CATS=[];
let F={id:null,d:"",by:"Thiện",t:"",a:"",paid:true,note:"",g:"",c:"",manual:false};
let FILTER={m:null,q:"",unpaid:false};
let LASTID=null;

function rebuildLearn(){
  LEARN={};
  // ITEMS đang sắp mới -> cũ; duyệt ngược để bản mới nhất ghi đè
  for(let i=ITEMS.length-1;i>=0;i--){const x=ITEMS[i];if(x.c&&x.c!=="Chưa phân loại")LEARN[norm(x.t)]={g:x.g,c:x.c};}
}
function quickPicks(){
  const cnt={};
  ITEMS.slice(0,250).forEach(x=>{const k=x.t.trim();if(!cnt[k])cnt[k]={t:k,n:0,amts:{}};cnt[k].n++;cnt[k].amts[x.a]=(cnt[k].amts[x.a]||0)+1;});
  return Object.values(cnt).filter(x=>x.n>=2).sort((a,b)=>b.n-a.n).slice(0,6).map(x=>{
    const top=Object.entries(x.amts).sort((a,b)=>b[1]-a[1])[0];
    return{t:x.t,a:top&&top[1]>=2?+top[0]:null};});
}

/* ---------- render ---------- */
function shell(){
  const cm=D.today.slice(0,7);
  const mItems=ITEMS.filter(x=>x.d.slice(0,7)===cm);
  const mTot=mItems.reduce((a,x)=>a+ +x.a,0);
  const unpaid=ITEMS.filter(x=>!x.paid);
  const uTot=unpaid.reduce((a,x)=>a+ +x.a,0);
  const todayTot=ITEMS.filter(x=>x.d===D.today).reduce((a,x)=>a+ +x.a,0);
  return `<div class="sheet">
  <h1>Nhập chi phí — Quỹ Kỳ Tích</h1>
  <div class="sub">Người nhập: <b>${esc(D.by)}</b> · Lưu thẳng vào hệ thống, báo cáo cổ đông và dashboard cập nhật ngay ·
   <a href="/crmcodong?t=${encodeURIComponent(TOKEN)}">Xem báo cáo →</a></div>
  <div class="hr"></div>
  <div class="row c3">
   <div class="card"><div class="lab">Chi tháng ${cm.slice(5)}/${cm.slice(0,4)}</div><div class="val">${vnd(mTot)}</div><div class="note">${mItems.length} khoản</div></div>
   <div class="card"><div class="lab">Hôm nay ${dm(D.today)}</div><div class="val">${vnd(todayTot)}</div><div class="note">${ITEMS.filter(x=>x.d===D.today).length} khoản</div></div>
   <div class="card"><div class="lab">Chưa thanh toán</div><div class="val ${uTot?"amber":""}">${vnd(uTot)}</div><div class="note">${unpaid.length} khoản đang treo</div></div>
  </div>
  <div class="layout">
   <div class="form" id="form"></div>
   <div class="list" id="list"></div>
  </div>
 </div>`;
}

function renderForm(){
  const g=F.manual?{g:F.g,c:F.c,src:"manual"}:guessCat(F.t);
  const amt=parseAmt(F.a);
  const picks=quickPicks();
  const catOpts=CATS.map(x=>`<option value="${esc(x.g)}|||${esc(x.c)}" ${g&&g.g===x.g&&g.c===x.c?"selected":""}>${esc(x.g)} › ${esc(x.c)}</option>`).join("");
  let catHint="";
  if(!F.t.trim())catHint='<span style="color:#94a3b8">Gõ nội dung, hệ thống tự xếp danh mục</span>';
  else if(g.src==="none")catHint='<span class="warn">Chưa nhận ra danh mục</span> — <a data-act="pickcat">chọn tay</a>';
  else catHint=`→ <b>${esc(g.c)}</b> <span style="color:#94a3b8">(${esc(g.g)}${g.src==="hist"?", theo lần nhập trước":""}${g.src==="manual"?", chọn tay":""})</span> · <a data-act="pickcat">đổi</a>`;
  document.getElementById("form").innerHTML=`
   <h2>${F.id?"Sửa khoản chi":"Thêm khoản chi"}</h2>
   <div class="edit-banner ${F.id?"on":""}"><span>Đang sửa khoản <b>${esc(F.t)}</b></span><button class="btn ghost" data-act="cancel" style="padding:3px 10px;font-size:12px">Huỷ</button></div>
   <div class="two">
    <div class="f"><label>Ngày chi</label><input type="date" id="fd" value="${esc(F.d)}" max="${D.today}"></div>
    <div class="f"><label>Người chi</label><div class="seg" id="fby">
      <button type="button" data-v="Thiện" class="${F.by==="Thiện"?"on":""}">Thiện</button>
      <button type="button" data-v="Thắng" class="${F.by==="Thắng"?"on":""}">Thắng</button></div></div>
   </div>
   <div class="f"><label>Nội dung chi</label>
    <input type="text" id="ft" value="${esc(F.t)}" placeholder="VD: Thưởng đăng bài review, Lovable, Nạp tiền ads..." list="dl" autocomplete="off">
    <datalist id="dl">${[...new Set(ITEMS.map(x=>x.t))].slice(0,120).map(t=>`<option value="${esc(t)}">`).join("")}</datalist>
    <div class="hint" id="catHint">${catHint}</div>
    <select id="fcat" style="display:none;margin-top:6px">${catOpts}</select>
    ${!F.id&&picks.length?`<div class="chips">${picks.map((p,i)=>`<button type="button" class="chip" data-pick="${i}">${esc(p.t)}${p.a?" · "+short(p.a):""}</button>`).join("")}</div>`:""}
   </div>
   <div class="two">
    <div class="f"><label>Số tiền</label>
     <input type="text" id="fa" value="${esc(F.a)}" placeholder="100k · 1tr2 · 450000" inputmode="decimal" autocomplete="off">
     <div class="hint" id="amtHint">${F.a?(amt==null?'<span class="warn">Không đọc được số tiền</span>':"= <b>"+vnd(amt)+"</b>"):""}</div></div>
    <div class="f"><label>Trạng thái</label><div class="seg st" id="fpaid">
      <button type="button" data-v="true" class="${F.paid?"on":""}">Đã trả</button>
      <button type="button" data-v="false" class="${!F.paid?"on":""}">Chưa trả</button></div></div>
   </div>
   <div class="f"><label>Ghi chú / link <span style="text-transform:none;font-weight:400">(không bắt buộc)</span></label>
    <input type="text" id="fn" value="${esc(F.note)}" placeholder="Link bài review, link TikTok, số hoá đơn..." autocomplete="off"></div>
   <div class="btns">
    <button class="btn" id="save">${F.id?"Lưu thay đổi":"Lưu khoản chi"}</button>
    ${F.id?'<button class="btn ghost" data-act="cancel">Huỷ</button>':""}
   </div>
   <div class="kbd">Enter để lưu · sau khi lưu giữ nguyên ngày, người chi, trạng thái để nhập tiếp</div>`;
  wireForm();
}

function refreshHints(){
  const g=F.manual?{g:F.g,c:F.c,src:"manual"}:guessCat(F.t);
  const el=document.getElementById("catHint");
  if(!F.t.trim())el.innerHTML='<span style="color:#94a3b8">Gõ nội dung, hệ thống tự xếp danh mục</span>';
  else if(g.src==="none")el.innerHTML='<span class="warn">Chưa nhận ra danh mục</span> — <a data-act="pickcat">chọn tay</a>';
  else el.innerHTML=`→ <b>${esc(g.c)}</b> <span style="color:#94a3b8">(${esc(g.g)}${g.src==="hist"?", theo lần nhập trước":""}${g.src==="manual"?", chọn tay":""})</span> · <a data-act="pickcat">đổi</a>`;
  const sel=document.getElementById("fcat");
  if(g&&sel.style.display==="none")sel.value=g.g+"|||"+g.c;
  const a=parseAmt(F.a),ah=document.getElementById("amtHint");
  ah.innerHTML=F.a?(a==null?'<span class="warn">Không đọc được số tiền</span>':"= <b>"+vnd(a)+"</b>"):"";
  document.getElementById("fa").classList.toggle("bad",!!F.a&&a==null);
}

function wireForm(){
  const $=id=>document.getElementById(id);
  $("fd").onchange=e=>{F.d=e.target.value;};
  $("ft").oninput=e=>{F.t=e.target.value;if(!F.id)F.manual=false;refreshHints();};
  $("fa").oninput=e=>{F.a=e.target.value;refreshHints();};
  $("fn").oninput=e=>{F.note=e.target.value;};
  $("fcat").onchange=e=>{const[g,c]=e.target.value.split("|||");F.g=g;F.c=c;F.manual=true;refreshHints();};
  document.querySelectorAll("#fby button").forEach(b=>b.onclick=()=>{F.by=b.dataset.v;
    document.querySelectorAll("#fby button").forEach(x=>x.classList.toggle("on",x===b));});
  document.querySelectorAll("#fpaid button").forEach(b=>b.onclick=()=>{F.paid=b.dataset.v==="true";
    document.querySelectorAll("#fpaid button").forEach(x=>x.classList.toggle("on",x===b));});
  document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{const p=quickPicks()[+b.dataset.pick];
    F.t=p.t;F.manual=false;if(p.a!=null)F.a=String(p.a.toLocaleString("vi-VN"));
    $("ft").value=F.t;$("fa").value=F.a;refreshHints();(p.a!=null?$("fn"):$("fa")).focus();});
  document.getElementById("form").onclick=e=>{const a=e.target.closest("[data-act]");if(!a)return;
    if(a.dataset.act==="pickcat"){const s=$("fcat");s.style.display=s.style.display==="none"?"block":"none";if(s.style.display==="block")s.focus();}
    if(a.dataset.act==="cancel")resetForm(true);};
  $("save").onclick=save;
  ["fd","ft","fa","fn"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();save();}}));
}

function renderAll(){
  document.getElementById("root").innerHTML=shell();
  renderForm();renderList();
}
function resetForm(full){
  const keep={d:F.d||D.today,by:F.by,paid:F.paid};
  F={id:null,d:full?D.today:keep.d,by:full?"Thiện":keep.by,t:"",a:"",paid:full?true:keep.paid,note:"",g:"",c:"",manual:false};
  renderAll();
  document.getElementById("ft").focus();
}

function renderList(){
  const months=[...new Set(ITEMS.map(x=>x.d.slice(0,7)))].sort().reverse();
  if(!FILTER.m)FILTER.m=months[0]||D.today.slice(0,7);
  const q=norm(FILTER.q);
  let rows=ITEMS.filter(x=>(FILTER.m==="all"||x.d.slice(0,7)===FILTER.m)
     &&(!FILTER.unpaid||!x.paid)
     &&(!q||norm(x.t+" "+x.c+" "+(x.note||"")+" "+x.by).includes(q)));
  const tot=rows.reduce((a,x)=>a+ +x.a,0);
  const byDay={};rows.forEach(x=>{(byDay[x.d]=byDay[x.d]||[]).push(x);});
  const days=Object.keys(byDay).sort().reverse();
  document.getElementById("list").innerHTML=`
   <h2>Các khoản đã nhập</h2>
   <div class="tools">
    ${months.slice(0,6).map(m=>`<button class="chip ${FILTER.m===m?"on":""}" data-m="${m}">${m.slice(5)}/${m.slice(0,4)}</button>`).join("")}
    <button class="chip ${FILTER.m==="all"?"on":""}" data-m="all">Tất cả</button>
   </div>
   <div class="tools">
    <input type="text" id="q" placeholder="Tìm: review, lovable, Quỳnh..." value="${esc(FILTER.q)}">
    <label><input type="checkbox" id="unp" ${FILTER.unpaid?"checked":""}> Chỉ chưa trả</label>
    <span style="font-size:12px;color:var(--muted);margin-left:auto">${rows.length} khoản · <b style="color:var(--ink)">${vnd(tot)}</b></span>
   </div>
   ${rows.length?`<table><thead><tr><th>Nội dung</th><th class="hide-m">Danh mục</th><th class="hide-m">Người chi</th>
     <th class="n">Số tiền</th><th>TT</th><th></th></tr></thead><tbody>
   ${days.map(d=>{const its=byDay[d];const dt=its.reduce((a,x)=>a+ +x.a,0);
     return `<tr class="day"><td colspan="6">${thu(d)} ${dm(d)}${d===D.today?" · hôm nay":""}<span class="dt">${vnd(dt)}</span></td></tr>`+
     its.map(x=>`<tr class="it ${F.id===x.id?"editing":""} ${LASTID===x.id?"flash":""}" data-id="${x.id}">
       <td><div class="desc">${esc(x.t)}${x.note?`<small>${esc(x.note.length>70?x.note.slice(0,70)+"…":x.note)}</small>`:""}</div>
        <div class="cat m ${x.c==="Chưa phân loại"?"unk":""}">${esc(x.c)} · ${esc(x.by)}</div></td>
       <td class="hide-m"><span class="cat ${x.c==="Chưa phân loại"?"unk":""}">${esc(x.c)}</span></td>
       <td class="hide-m">${esc(x.by)}</td>
       <td class="n"><b>${vnd(x.a)}</b></td>
       <td><span class="badge ${x.paid?"p":"u"}" data-flip="${x.id}" title="Bấm để đổi trạng thái">${x.paid?"Đã trả":"Chưa trả"}</span></td>
       <td class="act"><button data-edit="${x.id}">Sửa</button><button class="del" data-del="${x.id}">Xoá</button></td></tr>`).join("");}).join("")}
   </tbody></table>`:`<div class="empty">Không có khoản nào khớp bộ lọc.</div>`}
   <details class="log"><summary>Lịch sử thay đổi gần đây</summary><div id="logBox" style="margin-top:8px">${renderLog()}</div></details>`;
  wireList();
  LASTID=null;
}

function renderLog(){
  const L=D.log||[];
  if(!L.length)return'<div class="empty" style="padding:10px">Chưa có thay đổi nào qua form.</div>';
  const lab={them:"Thêm",sua:"Sửa",xoa:"Xoá",khoi_phuc:"Khôi phục"};
  const one=r=>r?`${esc(r.description)} · ${vnd(r.amount_vnd)} · ${dm(r.spent_on)}`:"";
  return L.map(l=>{let detail="";
    if(l.action==="sua"){const b=l.before||{},a=l.after||{};const ch=[];
      if(b.description!==a.description)ch.push(`nội dung "${esc(b.description)}" → "${esc(a.description)}"`);
      if(+b.amount_vnd!==+a.amount_vnd)ch.push(`tiền ${vnd(b.amount_vnd)} → ${vnd(a.amount_vnd)}`);
      if(b.spent_on!==a.spent_on)ch.push(`ngày ${dm(b.spent_on)} → ${dm(a.spent_on)}`);
      if(b.is_paid!==a.is_paid)ch.push(a.is_paid?"→ đã trả":"→ chưa trả");
      if(b.payer!==a.payer)ch.push(`người chi ${esc(b.payer)} → ${esc(a.payer)}`);
      if(b.category!==a.category)ch.push(`danh mục → ${esc(a.category)}`);
      if((b.note||"")!==(a.note||""))ch.push("ghi chú");
      detail=`<b>${esc(a.description)}</b>: ${ch.join(" · ")||"không đổi gì"}`;}
    else detail=one(l.after||l.before);
    return`<div class="lg"><span class="t">${esc(l.at)}</span><span class="a ${l.action}">${lab[l.action]||l.action}</span><span>${detail}</span></div>`;}).join("");
}

function wireList(){
  document.querySelectorAll("#list [data-m]").forEach(b=>b.onclick=()=>{FILTER.m=b.dataset.m;renderList();});
  const q=document.getElementById("q");
  q.oninput=e=>{FILTER.q=e.target.value;clearTimeout(q._t);q._t=setTimeout(()=>{const pos=e.target.selectionStart;renderList();
    const nq=document.getElementById("q");nq.focus();nq.setSelectionRange(pos,pos);},180);};
  document.getElementById("unp").onchange=e=>{FILTER.unpaid=e.target.checked;renderList();};
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>startEdit(b.dataset.edit));
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>del(b.dataset.del));
  document.querySelectorAll("[data-flip]").forEach(b=>b.onclick=()=>flip(b.dataset.flip));
}

/* ---------- actions ---------- */
function payload(x){return{id:x.id||"",d:x.d,by:x.by,t:x.t,a:String(x.a),paid:x.paid,note:x.note||"",g:x.g,c:x.c};}

async function save(){
  const btn=document.getElementById("save");
  const amt=parseAmt(F.a);
  if(!F.d){toast("Chọn ngày chi",true);return;}
  if(!F.t.trim()){toast("Nhập nội dung chi",true);document.getElementById("ft").focus();return;}
  if(amt==null){toast("Số tiền không hợp lệ",true);document.getElementById("fa").focus();return;}
  const g=F.manual?{g:F.g,c:F.c}:guessCat(F.t);
  btn.disabled=true;btn.textContent="Đang lưu...";
  try{
    const wasEdit=!!F.id;
    const r=await rpc("fin_exp_save",{p:{id:F.id||"",d:F.d,by:F.by,t:F.t.trim(),a:String(amt),paid:F.paid,note:F.note,g:g.g,c:g.c}});
    await reload();
    LASTID=r.id;
    toast(wasEdit?"Đã lưu thay đổi":`Đã thêm: ${r.description} · ${vnd(r.amount_vnd)}`);
    resetForm(false);
  }catch(e){toast(e.message,true);btn.disabled=false;btn.textContent=F.id?"Lưu thay đổi":"Lưu khoản chi";}
}

function startEdit(id){
  const x=ITEMS.find(i=>i.id===id);if(!x)return;
  F={id:x.id,d:x.d,by:x.by,t:x.t,a:(+x.a).toLocaleString("vi-VN"),paid:x.paid,note:x.note||"",g:x.g,c:x.c,manual:true};
  renderForm();renderList();
  if(window.innerWidth<900)document.getElementById("form").scrollIntoView({behavior:"smooth"});
  document.getElementById("fa").focus();
}

async function del(id){
  const x=ITEMS.find(i=>i.id===id);if(!x)return;
  if(!confirm(`Xoá khoản "${x.t}" · ${vnd(x.a)} ngày ${dm(x.d)}?`))return;
  try{
    await rpc("fin_exp_delete",{p_id:id});
    if(F.id===id)F={id:null,d:F.d,by:F.by,t:"",a:"",paid:F.paid,note:"",g:"",c:"",manual:false};
    await reload();renderAll();
    toast(`Đã xoá: ${x.t} · ${vnd(x.a)}`,false,"Hoàn tác",async()=>{
      try{await rpc("fin_exp_restore",{p_id:id});LASTID=id;await reload();renderAll();toast("Đã khôi phục");}
      catch(e){toast(e.message,true);}});
  }catch(e){toast(e.message,true);}
}

async function flip(id){
  const x=ITEMS.find(i=>i.id===id);if(!x)return;
  try{
    await rpc("fin_exp_save",{p:payload(Object.assign({},x,{paid:!x.paid}))});
    LASTID=id;await reload();renderAll();
    toast(!x.paid?`Đã đánh dấu đã trả: ${x.t}`:`Chuyển về chưa trả: ${x.t}`);
  }catch(e){toast(e.message,true);}
}

let toastT=null;
function toast(msg,err,btnLabel,btnFn){
  const t=document.getElementById("toast"),b=document.getElementById("toastBtn");
  document.getElementById("toastMsg").textContent=msg;
  t.classList.toggle("err",!!err);
  if(btnLabel){b.style.display="";b.textContent=btnLabel;b.onclick=()=>{t.classList.remove("on");btnFn();};}
  else b.style.display="none";
  t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),btnLabel?7000:2800);
}

async function reload(){
  D=await rpc("fin_exp_list");
  ITEMS=D.items||[];CATS=(D.cats||[]).filter(x=>x.g&&x.c);
  rebuildLearn();
}

function fail(t,m){document.getElementById("root").innerHTML=`<div class="center"><div class="box"><h2>${t}</h2><p>${m}</p></div></div>`;}

async function boot(){
  if(!TOKEN)return fail("Thiếu mã truy cập","Đường dẫn không đầy đủ. Dùng đúng link nhập chi phí đã được gửi.");
  try{await reload();}
  catch(e){return fail("Không mở được trang nhập",esc(e.message));}
  F.d=D.today;
  renderAll();
  document.getElementById("ft").focus();
}
boot();
</script>
</body>
</html>
